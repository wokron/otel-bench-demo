[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "microservice-demo-api"
version = "0.1.0"
description = "Plugin-based observability and chaos API for microservice demos"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "pydantic>=2.9,<3", "PyYAML>=6,<7"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
demo-api = "demo_api.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["demo_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
