spec_version: demo-api/v1
state_path: .state/experiments.sqlite3
targets:
  - id: otel-demo
    description: OpenTelemetry Demo catalog subset on minikube
    discovery:
      plugin: kubernetes
      config:
        context: minikube
        namespace: otel-demo
        selector: opentelemetry.io/name
        service_label: opentelemetry.io/name
    telemetry:
      traces:
        plugin: jaeger
        config:
          service: jaeger
          port: 16686
          api_path: /jaeger/ui/api
      logs:
        plugin: kubernetes-logs
        config: {}
    actions:
      plugin: chaosblade
      config:
        allowed_actions: [pod.kill, cpu.load, network.delay]
